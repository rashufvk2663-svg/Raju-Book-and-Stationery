<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#142b4a"><meta name="description" content="RAJU BOOK & STATIONERY - Offline stock, purchase, sales and accounts manager">
<link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>RAJU BOOK & STATIONERY</title>
<style>
:root{--navy:#142b4a;--navy2:#1d416b;--blue:#2f6fed;--bg:#f3f6fb;--card:#fff;--text:#172334;--muted:#718096;--line:#e5eaf1;--green:#12805c;--red:#c43d4b;--amber:#a86408;--shadow:0 8px 28px #142b4a0d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Noto Sans Devanagari",Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:245px;background:var(--navy);color:#fff;padding:22px 14px;display:flex;flex-direction:column;z-index:5}.brand{display:flex;gap:11px;align-items:center;padding:0 8px 24px}.brand-mark{width:42px;height:42px;border-radius:13px;background:#fff;color:var(--navy);display:grid;place-items:center;font-size:23px}.brand b{font-size:15px;line-height:1.3}.brand small{display:block;color:#b9c8da;font-size:11px;margin-top:3px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#d8e2ee;text-align:left;padding:12px 13px;border-radius:10px;display:flex;gap:12px;align-items:center}.nav button.active,.nav button:hover{background:#ffffff19;color:#fff}.nav .ico{width:20px;text-align:center;font-size:17px}.side-foot{margin-top:auto;color:#aebfd2;font-size:11px;padding:12px}.main{margin-left:245px;min-height:100vh}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:4}.topbar h1{font-size:19px;margin:0}.topbar small{color:var(--muted)}.top-actions{display:flex;gap:9px;align-items:center}.content{max-width:1280px;margin:auto;padding:26px 30px 90px}.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.page-head h2{font-size:21px;margin:0}.page-head p{color:var(--muted);margin:4px 0 0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:var(--shadow)}.stat small{color:var(--muted)}.stat strong{display:block;font-size:25px;margin-top:7px;letter-spacing:-.5px}.stat .sub{font-size:11px;color:var(--muted);margin-top:5px}.section{margin-top:22px}.section-title{font-weight:700;font-size:16px;margin:0 0 12px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.quick button{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px;text-align:left;color:var(--navy);font-weight:650}.quick button span{display:block;font-size:23px;margin-bottom:8px}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--navy);color:white;font-weight:650}.btn:hover{filter:brightness(1.1)}.btn.secondary{background:#edf2f8;color:var(--navy)}.btn.blue{background:var(--blue)}.btn.danger{background:#fff0f1;color:var(--red)}.btn.small{padding:7px 10px;font-size:12px}.btn:disabled{opacity:.5;cursor:not-allowed}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#455468}.field input,.field select,.field textarea,.search{width:100%;border:1px solid #d8e0ea;border-radius:9px;padding:10px 11px;background:#fff;color:var(--text);outline:none}.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2f6fed18}.hint{font-size:11px;color:var(--muted)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:13px}.toolbar .search{max-width:300px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}table{border-collapse:collapse;width:100%;min-width:650px}th,td{padding:12px 13px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:#65758a;background:#f8fafc}td{font-size:13px}tr:last-child td{border-bottom:0}.muted{color:var(--muted)}.pill{display:inline-block;border-radius:20px;padding:3px 8px;background:#eef3fa;color:#3c5574;font-size:11px}.pill.low{background:#fff0e7;color:var(--amber)}.pill.good{background:#e8f7f1;color:var(--green)}.empty{text-align:center;color:var(--muted);padding:28px}.product-thumb{width:40px;height:40px;object-fit:cover;border-radius:8px;background:#edf1f6}.actions{display:flex;gap:6px;flex-wrap:wrap}.notice{padding:12px 14px;border-radius:10px;background:#edf4ff;color:#31557e;margin:12px 0}.notice.warn{background:#fff4e5;color:#87530b}.notice.success{background:#eaf8f1;color:#126746}.two{display:grid;grid-template-columns:1.2fr .8fr;gap:15px}.line-item{display:grid;grid-template-columns:2fr .8fr .8fr .8fr auto;gap:8px;align-items:end;margin:10px 0}.bill-total{display:flex;justify-content:space-between;padding:14px 0;border-top:1px solid var(--line);font-weight:700}.mobile-head{display:none}.bottom-nav{display:none}.photo-preview{width:72px;height:72px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}.modal-back{position:fixed;inset:0;background:#0d1b2b80;display:grid;place-items:center;padding:15px;z-index:20}.modal{background:white;border-radius:16px;padding:22px;max-width:620px;width:100%;max-height:90vh;overflow:auto}.modal h3{margin-top:0}.toast{position:fixed;bottom:22px;right:22px;background:#172b43;color:white;padding:12px 16px;border-radius:10px;z-index:30;box-shadow:var(--shadow)}.hidden{display:none!important}.voice{border-radius:50%;width:42px;height:42px;padding:0;font-size:18px}.footnote{font-size:11px;color:var(--muted);margin-top:18px}
@media(max-width:900px){.sidebar{width:205px}.main{margin-left:205px}.grid{grid-template-columns:repeat(2,1fr)}.quick{grid-template-columns:repeat(2,1fr)}.content{padding:20px}}
@media(max-width:650px){.sidebar{display:none}.main{margin:0}.topbar{height:62px;padding:0 16px}.topbar h1{font-size:15px}.topbar small{display:none}.content{padding:17px 14px 100px}.grid{gap:9px}.card{padding:14px}.stat strong{font-size:21px}.quick{gap:9px}.quick button{padding:13px}.page-head{align-items:flex-start}.page-head h2{font-size:18px}.two{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.line-item{grid-template-columns:1fr 1fr}.line-item .wide{grid-column:1/-1}.bottom-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:8}.bottom-nav button{border:0;background:transparent;color:#6c7a8c;font-size:10px;padding:4px 0;display:grid;justify-items:center;gap:2px}.bottom-nav button span{font-size:18px}.bottom-nav button.active{color:var(--blue);font-weight:700}.toast{left:14px;right:14px;bottom:78px;text-align:center}.toolbar .search{max-width:none;flex:1}.top-actions .voice{width:36px;height:36px}.table-wrap{border-radius:9px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
 <div class="brand"><div class="brand-mark">📚</div><div><b>RAJU BOOK<br>& STATIONERY</b><small>Business Manager</small></div></div>
 <nav class="nav" id="sideNav"></nav><div class="side-foot">Offline-first • Data saved on this device</div>
</aside>
<div class="main">
 <header class="topbar"><div><h1 id="topTitle">Business Dashboard</h1><small id="todayLabel"></small></div><div class="top-actions"><button class="btn secondary voice" id="voiceBtn" title="Voice Assistant">🎙️</button><button class="btn secondary small" id="backupQuick">Backup</button></div></header>
 <main class="content" id="view"></main>
</div>
<nav class="bottom-nav" id="bottomNav"></nav>
</div>
<div id="overlay"></div><div id="toast" class="toast hidden"></div>
<script>
"use strict";
const DB_NAME="RajuBookStationery", DB_VERSION=2;
const STORES=["products","purchases","sales","weeklyStock","settings","transactions"];
let db, currentPage="dashboard", cart=[], toastTimer, draftPhoto="";
const navItems=[["dashboard","⌂","डैशबोर्ड"],["products","▣","सामान"],["purchase","＋","खरीद"],["sales","▤","बिक्री"],["stock","◫","स्टॉक"],["reports","▥","रिपोर्ट"],["history","◷","इतिहास"],["settings","⚙","सेटिंग"]];
const money=n=>"₹"+(Number(n)||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const num=n=>Number.isFinite(Number(n))?Number(n):0;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dateText=d=>new Date(d).toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"});
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const x=r.result;STORES.forEach(s=>{if(!x.objectStoreNames.contains(s))x.createObjectStore(s,{keyPath:"id",autoIncrement:true})})};r.onsuccess=()=>{db=r.result;resolve()};r.onerror=()=>reject(r.error)})}
function tx(store,mode="readonly"){return db.transaction(store,mode).objectStore(store)}
function all(store){return new Promise((res,rej)=>{const r=tx(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function get(store,id){return new Promise((res,rej)=>{const r=tx(store).get(Number(id));r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function save(store,obj){return new Promise((res,rej)=>{const t=db.transaction(store,"readwrite"),r=t.objectStore(store).put(obj);t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
function atomic(stores,fn){return new Promise((resolve,reject)=>{const t=db.transaction(stores,"readwrite"),s={};stores.forEach(k=>s[k]=t.objectStore(k));let result;try{result=fn(s)}catch(e){t.abort();reject(e);return}t.oncomplete=()=>resolve(result);t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error||new Error("Transaction aborted"))})}
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.remove("hidden");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add("hidden"),2600)}
function setNav(){const html=navItems.map(([id,ico,label])=>'<button data-page="'+id+'" class="'+(currentPage===id?"active":"")+'"><span class="ico">'+ico+'</span>'+label+'</button>').join("");document.getElementById("sideNav").innerHTML=html;document.getElementById("bottomNav").innerHTML=navItems.filter(x=>["dashboard","products","purchase","sales","reports"].includes(x[0])).map(([id,ico,label])=>'<button data-page="'+id+'" class="'+(currentPage===id?"active":"")+'"><span>'+ico+'</span>'+label+'</button>').join("");document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>navigate(b.dataset.page))}
function navigate(page){currentPage=page;setNav();document.getElementById("topTitle").textContent=(navItems.find(x=>x[0]===page)||[])[2]||"Dashboard";render()}
const pageHead=(title,desc,action="")=>'<div class="page-head"><div><h2>'+title+'</h2><p>'+desc+'</p></div>'+action+'</div>';
const field=(label,name,type="text",value="",extra="")=>'<div class="field"><label>'+label+'</label><input name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+extra+'></div>';
async function products(){return all("products")}
async function dashboard(){const [ps,ss,low,pp]=await Promise.all([products(),all("sales"),all("products"),all("purchases")]);const today=new Date().toDateString(),sales=ss.filter(x=>new Date(x.date).toDateString()===today),saleTotal=sales.reduce((a,x)=>a+num(x.grandTotal),0),profit=sales.reduce((a,x)=>a+num(x.totalProfit),0),stock=ps.reduce((a,x)=>a+num(x.stock),0),lowCount=low.filter(x=>num(x.stock)<=num(x.minStock)).length;return pageHead("नमस्कार!","आपके व्यवसाय का आज का सारांश",'<button class="btn" onclick="navigate(\'products\')">＋ सामान जोड़ें</button>')+
'<div class="grid"><div class="card stat"><small>कुल सामान</small><strong>'+ps.length+'</strong><div class="sub">अलग-अलग आइटम</div></div><div class="card stat"><small>कुल उपलब्ध स्टॉक</small><strong>'+stock.toLocaleString("en-IN")+'</strong><div class="sub">सभी बेस यूनिट मिलाकर</div></div><div class="card stat"><small>आज की बिक्री</small><strong>'+money(saleTotal)+'</strong><div class="sub">'+sales.length+' बिल</div></div><div class="card stat"><small>आज का अनुमानित लाभ</small><strong>'+money(profit)+'</strong><div class="sub">वर्तमान latest cost के आधार पर दर्ज बिक्री</div></div></div>'+
'<div class="section"><h3 class="section-title">त्वरित काम</h3><div class="quick"><button onclick="navigate(\'purchase\')"><span>🛒</span>खरीद दर्ज करें</button><button onclick="navigate(\'sales\')"><span>🧾</span>नई बिक्री</button><button onclick="navigate(\'stock\')"><span>📦</span>साप्ताहिक स्टॉक</button><button onclick="navigate(\'reports\')"><span>📊</span>रिपोर्ट देखें</button></div></div>'+
'<div class="section two"><div class="card"><h3 class="section-title">कम स्टॉक अलर्ट <span class="pill '+(lowCount?"low":"good")+'">'+lowCount+' आइटम</span></h3><div id="lowList"></div></div><div class="card"><h3 class="section-title">हाल की बिक्री</h3><div id="recentSales"></div></div></div>';
}
async function renderDashboardExtras(){const [ps,ss]=await Promise.all([products(),all("sales")]);const low=ps.filter(p=>num(p.stock)<=num(p.minStock));document.getElementById("lowList").innerHTML=low.length?low.slice(0,6).map(p=>'<p style="margin:8px 0"><b>'+esc(p.name)+'</b> <span class="pill low">'+num(p.stock)+' '+esc(p.baseUnit)+'</span></p>').join(""):'<p class="muted">कोई कम स्टॉक अलर्ट नहीं।</p>';document.getElementById("recentSales").innerHTML=ss.length?ss.slice(-5).reverse().map(s=>'<p style="margin:8px 0"><b>'+money(s.grandTotal)+'</b><span class="muted"> · '+dateText(s.date)+'</span></p>').join(""):'<p class="muted">अभी बिक्री दर्ज नहीं है।</p>'}
async function renderProducts(){const ps=await products();return pageHead("सामान की सूची","प्रोडक्ट, खरीद लागत, बिक्री मूल्य और स्टॉक मैनेज करें",'<button class="btn" onclick="productForm()">＋ नया सामान</button>')+'<div class="toolbar"><input class="search" id="productSearch" placeholder="नाम या कैटेगरी खोजें…"><span class="pill">'+ps.length+' आइटम</span></div><div class="table-wrap"><table><thead><tr><th>सामान</th><th>कोड / कैटेगरी</th><th>स्टॉक</th><th>Latest Cost</th><th>बिक्री मूल्य</th><th>प्रति यूनिट लाभ</th><th>काम</th></tr></thead><tbody id="productRows">'+productRows(ps)+'</tbody></table></div>'}
function productRows(ps){return ps.length?ps.map(p=>'<tr><td><div style="display:flex;gap:9px;align-items:center">'+(p.photo?'<img class="product-thumb" src="'+p.photo+'">':'<div class="product-thumb" style="display:grid;place-items:center">📦</div>')+'<b>'+esc(p.name)+'</b></div></td><td>'+esc(p.itemCode||"—")+'<br><span class="muted">'+esc(p.category||"General")+'</span></td><td><b>'+num(p.stock)+'</b> '+esc(p.baseUnit||"पीस")+(num(p.stock)<=num(p.minStock)?' <span class="pill low">कम</span>':'')+'</td><td>'+money(p.purchaseCost)+'</td><td>'+money(p.sellingPrice)+'</td><td>'+money(num(p.sellingPrice)-num(p.purchaseCost))+'</td><td><div class="actions"><button class="btn secondary small" onclick="productForm('+p.id+')">बदलें</button><button class="btn danger small" onclick="deleteProduct('+p.id+')">हटाएँ</button></div></td></tr>').join(""):'<tr><td colspan="7" class="empty">अभी सामान नहीं जोड़ा गया। “नया सामान” दबाएँ।</td></tr>'}
async function productForm(id){const p=id?await get("products",id):{};draftPhoto=p.photo||"";showModal('<h3>'+(id?"सामान की जानकारी बदलें":"नया सामान जोड़ें")+'</h3><form id="productForm" class="form-grid">'+
'<div class="field full"><label>सामान का नाम *</label><input name="name" required value="'+esc(p.name||"")+'" placeholder="जैसे: 200 पेज कॉपी"></div>'+
field("कैटेगरी","category","text",p.category||"स्टेशनरी")+
field("आइटम कोड / SKU","itemCode","text",p.itemCode||"")+
field("खरीद लागत प्रति बेस यूनिट (₹)","purchaseCost","number",p.purchaseCost||0,'min="0" step="0.01" required')+
field("बिक्री मूल्य प्रति बेस यूनिट (₹)","sellingPrice","number",p.sellingPrice||0,'min="0" step="0.01" required')+
field("शुरुआती स्टॉक (बेस यूनिट)","openingStock","number",id?(p.stock||0):0,'min="0" step="0.001" required')+
field("न्यूनतम स्टॉक अलर्ट","minStock","number",p.minStock??5,'min="0" step="0.001"')+
field("बेस यूनिट","baseUnit","text",p.baseUnit||"पीस",'required placeholder="पीस / कॉपी / पेन"')+
'<div class="field full"><label>यूनिट कन्वर्जन (एक लाइन में एक यूनिट = बेस यूनिट की संख्या)</label><textarea name="conversions" rows="3" placeholder="दर्जन=12&#10;पैकेट=10&#10;बॉक्स=100">'+esc((p.conversions||[]).map(c=>c.name+"="+c.factor).join("\n"))+'</textarea><span class="hint">उदाहरण: दर्जन=12, बॉक्स=100. खाली छोड़ने पर केवल बेस यूनिट रहेगी।</span></div>'+
'<div class="field full"><label>सामान की फोटो (कैमरा या गैलरी)</label><input id="photoInput" type="file" accept="image/*" capture="environment"><div id="photoPreview">'+(draftPhoto?'<img class="photo-preview" src="'+draftPhoto+'">':'')+'</div><span class="hint">फोटो इसी डिवाइस के ऑफलाइन डेटाबेस में सेव होगी।</span></div>'+
'<div class="field full" style="display:flex;gap:8px;flex-direction:row;justify-content:flex-end"><button type="button" class="btn secondary" onclick="closeModal()">रद्द करें</button><button class="btn">सेव करें</button></div></form>');
document.getElementById("photoInput").onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>3*1024*1024){toast("फोटो 3 MB से छोटी रखें");return}draftPhoto=await resizeImage(f);document.getElementById("photoPreview").innerHTML='<img class="photo-preview" src="'+draftPhoto+'">'};
document.getElementById("productForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),name=String(f.get("name")).trim(),baseUnit=String(f.get("baseUnit")).trim();if(!name||!baseUnit)return;const conversions=[];for(const line of String(f.get("conversions")).split(/\n|,/)){const m=line.trim().match(/^(.+?)\s*=\s*(\d+(?:\.\d+)?)$/);if(m&&num(m[2])>0)conversions.push({name:m[1].trim(),factor:num(m[2])})}const data={...(p||{}),name,category:String(f.get("category")||"General"),itemCode:String(f.get("itemCode")||""),purchaseCost:num(f.get("purchaseCost")),sellingPrice:num(f.get("sellingPrice")),stock:id?num(p.stock):num(f.get("openingStock")),minStock:num(f.get("minStock")),baseUnit,conversions,photo:draftPhoto,updatedAt:new Date().toISOString()};if(!id)data.createdAt=data.updatedAt;await save("products",data);if(!id&&num(f.get("openingStock"))>0)await save("transactions",{type:"opening",productName:name,quantity:num(f.get("openingStock")),date:new Date().toISOString()});closeModal();toast("सामान सेव हो गया");render()};
}
function resizeImage(file){return new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas"),scale=Math.min(1,800/Math.max(img.width,img.height));c.width=img.width*scale;c.height=img.height*scale;c.getContext("2d").drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL("image/jpeg",.78))};img.src=reader.result};reader.readAsDataURL(file)})}
async function deleteProduct(id){const p=await get("products",id);if(!p)return;if(!confirm('"'+p.name+'" हटाएँ? पुराने खरीद/बिक्री रिकॉर्ड सुरक्षित रहेंगे।'))return;await new Promise((res,rej)=>{const t=db.transaction("products","readwrite");t.objectStore("products").delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)});toast("सामान हटाया गया");render()}

async function renderHistory(){const [ss,pp,ws,ts]=await Promise.all([all("sales"),all("purchases"),all("weeklyStock"),all("transactions")]);const rows=ts.slice().reverse();return pageHead("लेन-देन इतिहास","सभी खरीद, बिक्री और स्टॉक गिनती का रिकॉर्ड")+'<div class="toolbar"><span class="pill">'+rows.length+' रिकॉर्ड</span><button class="btn secondary small" onclick="exportBackup()">बैकअप डाउनलोड</button></div><div class="table-wrap"><table><tr><th>तारीख</th><th>प्रकार</th><th>विवरण</th><th>राशि</th></tr>'+ (rows.length?rows.map(x=>'<tr><td>'+dateText(x.date)+'</td><td>'+({purchase:"खरीद",sale:"बिक्री",opening:"शुरुआती स्टॉक","stock-count":"स्टॉक गिनती"}[x.type]||x.type)+'</td><td>'+esc(x.productName||(x.items||[]).map(i=>i.productName).join(", ")||"—")+'</td><td>'+money(x.amount||0)+'</td></tr>').join(""):'<tr><td colspan="4" class="empty">अभी कोई लेन-देन नहीं।</td></tr>')+'</table></div>'}
async function renderSettings(){return pageHead("सेटिंग और डेटा सुरक्षा","बैकअप, रीस्टोर और इस ऐप की जानकारी")+'<div class="two"><div class="card"><h3 class="section-title">डेटा बैकअप</h3><p class="muted">सभी सामान, खरीद, बिक्री, स्टॉक गिनती और सेटिंग्स की JSON फाइल डाउनलोड करें।</p><button class="btn" onclick="exportBackup()">पूरा बैकअप डाउनलोड करें</button></div><div class="card"><h3 class="section-title">बैकअप रीस्टोर</h3><p class="muted">पहले से डाउनलोड की गई JSON बैकअप फाइल चुनें। इससे मौजूदा डेटा बदल जाएगा।</p><input id="restoreFile" type="file" accept=".json,application/json"><button class="btn danger" id="restoreBtn" style="margin-top:10px">बैकअप रीस्टोर करें</button></div></div><div class="section card"><h3 class="section-title">ऐप कनेक्शन और सीमाएँ</h3><p>• यह ऐप IndexedDB के जरिए इसी डिवाइस/ब्राउज़र में ऑफलाइन डेटा सेव करता है।</p><p>• कैमरा/गैलरी फोटो ब्राउज़र की अनुमति से काम करती है।</p><p>• वॉइस कमांड डिवाइस के Speech Recognition सपोर्ट पर निर्भर है।</p><p>• क्लाउड AI, मल्टी-डिवाइस सिंक और ऑनलाइन अकाउंटिंग सर्वर अभी कनेक्ट नहीं हैं।</p><p>• GitHub Pages पर यह PWA चलेगा; APK बनाने के लिए अलग Android पैकेजिंग/बिल्ड जरूरी है।</p></div><div class="section card"><h3 class="section-title">इंस्टॉल करें</h3><p class="muted">Chrome मेन्यू में “Add to Home screen” या “Install app” उपलब्ध हो तो इसे फोन में ऐप की तरह जोड़ सकते हैं।</p><button class="btn secondary" id="installBtn">ऐप इंस्टॉल विकल्प</button></div><p class="footnote">RAJU BOOK & STATIONERY · Offline Business Manager · डेटा साफ करने से पहले बैकअप जरूर लें।</p>'}
async function settingsExtras(){const r=document.getElementById("restoreBtn");if(r)r.onclick=async()=>{const file=document.getElementById("restoreFile").files[0];if(!file){toast("पहले बैकअप फाइल चुनें");return}if(!confirm("रीस्टोर करने से इस डिवाइस का मौजूदा डेटा बदल जाएगा। जारी रखें?"))return;try{const b=JSON.parse(await file.text());if(b.app!=="Raju Book and Stationery"||!b.data||!Array.isArray(b.data.products))throw Error("बैकअप फाइल सही नहीं है");await new Promise((resolve,reject)=>{const t=db.transaction(STORES,"readwrite");STORES.forEach(k=>{const st=t.objectStore(k);st.clear();(b.data[k]||[]).forEach(v=>st.put(v))});t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error)});toast("बैकअप रीस्टोर हो गया");navigate("dashboard")}catch(e){toast("रीस्टोर नहीं हुआ: "+e.message)}};const i=document.getElementById("installBtn");if(i)i.onclick=async()=>{if(window.deferredPrompt){window.deferredPrompt.prompt();await window.deferredPrompt.userChoice;window.deferredPrompt=null}else toast("Chrome मेन्यू ⋮ → Add to Home screen चुनें")}}
async function render(){const el=document.getElementById("view");el.innerHTML='<div class="card empty">लोड हो रहा है…</div>';try{let html="";if(currentPage==="dashboard")html=await dashboard();if(currentPage==="products")html=await renderProducts();if(currentPage==="purchase")html=await renderPurchase();if(currentPage==="sales")html=await renderSales();if(currentPage==="stock")html=await renderStock();if(currentPage==="reports")html=await renderReports();if(currentPage==="history")html=await renderHistory();if(currentPage==="settings")html=await renderSettings();el.innerHTML=html;if(currentPage==="dashboard")await renderDashboardExtras();if(currentPage==="products"){document.getElementById("productSearch").oninput=async e=>{const ps=await products();document.getElementById("productRows").innerHTML=productRows(ps.filter(p=>(p.name+" "+p.category+" "+p.itemCode).toLowerCase().includes(e.target.value.toLowerCase())))};}if(currentPage==="purchase")await purchaseExtras();if(currentPage==="sales")await salesExtras();if(currentPage==="stock")await stockExtras();if(currentPage==="reports")await reportsExtras();if(currentPage==="settings")await settingsExtras()}catch(e){console.error(e);el.innerHTML='<div class="card notice warn">यह पेज लोड नहीं हो पाया: '+esc(e.message)+'</div>'}}
function showModal(html){document.getElementById("overlay").innerHTML='<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal">'+html+'</div></div>'}function closeModal(){document.getElementById("overlay").innerHTML=""}
async function exportBackup(){const data={};for(const s of STORES)data[s]=await all(s);const b={app:"Raju Book and Stationery",version:2,createdAt:new Date().toISOString(),data};const blob=new Blob([JSON.stringify(b,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="Raju-Stationery-Backup-"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast("बैकअप डाउनलोड शुरू हुआ")}
window.exportBackup=exportBackup;window.productForm=productForm;window.deleteProduct=deleteProduct;window.navigate=navigate;window.closeModal=closeModal;
let deferredPrompt;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();window.deferredPrompt=e});
async function voiceCommand(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast("इस ब्राउज़र में वॉइस रिकग्निशन उपलब्ध नहीं है");return}const rec=new SR();rec.lang="hi-IN";rec.interimResults=false;rec.onresult=async e=>{const q=e.results[0][0].transcript.toLowerCase();let reply="मैंने सुना: "+q;if(q.includes("कितने")&&(/स्टॉक|बचे|कॉपी|पेन|पिन/.test(q))){const ps=await products(),p=ps.find(x=>q.includes(x.name.toLowerCase()));reply=p?p.name+" का स्टॉक "+p.stock+" "+p.baseUnit+" है।":"कृपया सामान का पूरा नाम बोलें।"}else if(q.includes("बिक्री")){navigate("sales");reply="बिक्री पेज खोल दिया है।"}else if(q.includes("खरीद")){navigate("purchase");reply="खरीद पेज खोल दिया है।"}else if(q.includes("सामान")||q.includes("प्रोडक्ट")){navigate("products");reply="सामान सूची खोल दी है।"}else if(q.includes("रिपोर्ट")){navigate("reports");reply="रिपोर्ट खोल दी है।"}else reply+="। अभी मैं स्टॉक पूछताछ और पेज खोलने जैसे सीमित वॉइस कमांड समझता हूँ।";toast(reply);if("speechSynthesis"in window){const u=new SpeechSynthesisUtterance(reply);u.lang="hi-IN";speechSynthesis.speak(u)}};rec.onerror=()=>toast("वॉइस कमांड नहीं चल पाया। माइक्रोफोन अनुमति जाँचें।");rec.start();toast("सुन रहा हूँ… बोलिए")}
document.getElementById("voiceBtn").onclick=voiceCommand;document.getElementById("backupQuick").onclick=exportBackup;
document.getElementById("todayLabel").textContent=new Date().toLocaleDateString("hi-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
(async()=>{try{await openDB();if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(console.warn);setNav();await render()}catch(e){document.getElementById("view").innerHTML='<div class="card notice warn">डेटाबेस शुरू नहीं हुआ: '+esc(e.message)+'. कृपया आधुनिक Chrome में खोलें।</div>'}})();
</script>
